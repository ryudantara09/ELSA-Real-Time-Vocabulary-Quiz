<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="arch-title">
  <title id="arch-title">Quiz architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1c1c1c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f7b3a"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", sans-serif; fill: #1c1c1c; }
      .title { font-size: 22px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .sub { font-size: 14px; }
      .label { font-size: 13px; font-weight: 600; }
      .frame-label { font-size: 16px; font-weight: 700; fill: #1d4e89; }
    </style>
  </defs>
  <rect width="1280" height="760" fill="#ffffff"/>
  <text class="title" x="40" y="44">Architecture</text>

  <rect x="40" y="140" width="240" height="360" rx="16" fill="#e8f1fb" stroke="#1d4e89" stroke-width="2"/>
  <text class="head" x="160" y="184" text-anchor="middle" fill="#1d4e89">Vue 3 client</text>
  <text class="sub" x="160" y="224" text-anchor="middle">QuizJoin</text>
  <text class="sub" x="160" y="252" text-anchor="middle">QuizQuestion</text>
  <text class="sub" x="160" y="280" text-anchor="middle">Leaderboard</text>
  <text class="sub" x="160" y="308" text-anchor="middle">ConnectionStatus</text>
  <text class="sub" x="160" y="352" text-anchor="middle" font-weight="700">useQuizSocket</text>
  <text class="sub" x="160" y="460" text-anchor="middle">One box per person</text>

  <rect x="400" y="80" width="840" height="520" rx="18" fill="#f7f9fc" stroke="#1d4e89" stroke-width="2"/>
  <text class="frame-label" x="428" y="116">FastAPI process</text>

  <rect x="450" y="160" width="190" height="80" rx="12" fill="#fff7e8" stroke="#8a5a00" stroke-width="2"/>
  <text class="head" x="545" y="196" text-anchor="middle" fill="#8a5a00">routes.py</text>
  <text class="sub" x="545" y="220" text-anchor="middle">create and join</text>

  <rect x="450" y="400" width="190" height="80" rx="12" fill="#fff7e8" stroke="#8a5a00" stroke-width="2"/>
  <text class="head" x="545" y="436" text-anchor="middle" fill="#8a5a00">ws.py</text>
  <text class="sub" x="545" y="460" text-anchor="middle">live connection</text>

  <rect x="760" y="250" width="200" height="130" rx="12" fill="#e5f6ea" stroke="#0f7b3a" stroke-width="2"/>
  <text class="head" x="860" y="298" text-anchor="middle" fill="#0f7b3a">QuizService</text>
  <text class="sub" x="860" y="330" text-anchor="middle">score</text>
  <text class="sub" x="860" y="354" text-anchor="middle">leaderboard</text>

  <rect x="1040" y="155" width="160" height="90" rx="12" fill="#f3f0ff" stroke="#4c3d8f" stroke-width="2"/>
  <text class="head" x="1120" y="196" text-anchor="middle" fill="#4c3d8f">Sessions</text>
  <text class="sub" x="1120" y="220" text-anchor="middle">in memory</text>

  <rect x="1040" y="395" width="160" height="90" rx="12" fill="#f3f0ff" stroke="#4c3d8f" stroke-width="2"/>
  <text class="head" x="1120" y="436" text-anchor="middle" fill="#4c3d8f">Rooms</text>
  <text class="sub" x="1120" y="460" text-anchor="middle">open sockets</text>

  <path d="M280 230 H360 V200 H450" fill="none" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="360" y="186" text-anchor="middle">REST join</text>

  <path d="M280 430 H450" fill="none" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="365" y="418" text-anchor="middle">WebSocket</text>

  <path d="M640 200 H700 V290 H760" fill="none" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 440 H720 V340 H760" fill="none" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="700" y="248" text-anchor="middle">submit</text>

  <path d="M960 290 H1000 V200 H1040" fill="none" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="1000" y="248" text-anchor="middle">save</text>

  <path d="M640 450 H1040" fill="none" stroke="#1c1c1c" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M1120 485 V680 H160 V500" fill="none" stroke="#0f7b3a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text class="label" x="640" y="668" text-anchor="middle" fill="#0f7b3a">leaderboard broadcast, this quiz only</text>
</svg>
